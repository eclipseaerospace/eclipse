# SPDX-License-Identifier: Apache-2.0
#
# Shoemaker — a lunar south pole site outside the Artemis III nine, as a
# parameter vector rather than a place.
#
# Never an Artemis III candidate. A large permanently shadowed crater, carried
# because it is the one terrain regime in this set that is mostly cold trap
# rather than mostly rim, and a pipeline built on rim sites should be run
# against one.
#
# What is citable about these regions is thin and it is worth being explicit
# about why. NASA names the nine and states their approximate size; it does
# not publish centre coordinates, and neither does the terrain archive. So
# this file records the region name, the programme statement, the crew
# comparison the legged case is argued against, and the identifier of the
# terrain product analysed. Where the numbers come from is the product's own
# extent, which the study reads from the file header rather than transcribing
# here.
#
# The body field carries gravity and the soil parameter set, so a Mars slope
# or a terrestrial analogue instantiates through this same file.

schema_version = 2
id             = "shoemaker"

[site]
name       = "Shoemaker"
body       = "moon"
soil       = "lunar-intercrater"
gravity    = { value = 1.62, units = "m/s^2" }

[region]
candidate                 = false
programme                 = "not an Artemis III candidate region as of the October 2024 announcement"
former_candidate_basis    = "NASA's 2022 announcement listed thirteen candidate regions; the October 2024 update narrowed them to nine"

# The human comparison, and the reason it is carried. Crew are limited to far
# gentler ground than a legged platform, so the terrain a robot opens is
# terrain crew cannot reach -- a stronger claim than reaching what they can.
[region.crew_limit]
maximum_slope_deg = 20.0
traverse_range_km = 2.0
source            = "Rice et al. (2023) LPSC, citing the Artemis III Science Definition Team report"

# The terrain product actually analysed. Its extent is the
# authoritative statement of where the numbers come from.
[terrain]
product      = "Shoemaker_final_adj_5mpp_surf"
product_name = "Shoemaker"
archive      = "NASA GSFC Planetary Geodynamics Data Archive"
manifest     = "data/terrain/manifest.toml"
name_basis   = "the PGDA collection README names this directory 'Shoemaker'"

# Declared, so that an empty axis is visible rather than absent.
[axes]
entry_slope_distribution   = "populated"
illumination_duty_cycle    = "populated"
cold_trap_range_and_depth  = "populated"
boulder_size_frequency     = "not measured"
annual_maximum_temperature = "not measured"
direct_to_earth_visibility = "not measured"
