[summary]
text = """
On mapped polar terrain at 5 m posting, with no obstacles, the wheeled
platform is the cheaper machine on most of the ground and the legged one
is the only machine on the rest. Those are not the same claim and the
study exists to keep them apart.

On level ground the rover costs 12.3 J/m against the quadruped's 18.9, an
advantage of 1.54 times, and the reason is a term rather than a
refinement: swing work is 86% of what the leg spends standing still and
moving, and a wheel does not pay it. That is the wheel's whole case and it
is a strong one.

The case ends at 8.0 degrees. Above it the wheel is more expensive and the
gap widens fast, because the resistance it must overcome is divided by one
minus its slip and its slip is climbing: 62% at twenty degrees against the
foot's 5%. At 26.6 degrees the rover stops entirely, on traction, and the
quadruped continues to 39.8 where it stops by tipping over.

The mechanism behind that is worth stating precisely because it is not the
one intuition offers. It is not that the wheel is short of friction. It is
that shear under a wheel builds from zero at the entry of the contact
patch to its maximum at the bottom, so the mobilised fraction is an
average over the patch. On a 0.25 m wheel in this regolith the patch is 45
mm long against a shear deformation modulus of 18 mm, and even at the slip
ceiling only about two thirds of the available shear is developed. The
rover cannot reach its own traction limit at any slip. This is why rover
operational slope limits sit well below their static ones, and it is the
same physics that stopped Spirit.

A bigger wheel is the obvious answer and it helps without rescuing: over
0.20 to 0.75 m the level cost falls by 2.74 times and the traction limit
rises from 24.3 to 35.4 degrees, still short of the quadruped's 39.8. A
0.75 m wheel on a 50 kg vehicle is also not a rover.

What would have to be true for the legged case to close is now a
specification rather than a hope, and none of it is in this repository:
boulder statistics at metre scale, which is the mechanism by which legs
actually win and the fifth time this project has asked for the same
measurement; a polar pit, when no archive holds one and the median
catalogued pit is three cells across at 5 m; and slope past the angle of
repose, which does not occur on the routes these errands need.

And the argument that runs the other way is the strongest one on the
table. Twelve or more actuators in abrasive cryogenic dust against four to
six is why every funded programme is wheeled, and nothing here models it.
A slope result that favours legs is worth very little beside it, and
saying so is not modesty but the condition for the rest being believed.
"""

