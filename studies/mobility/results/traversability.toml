# The measured-versus-extrapolated boundary for this study. Counts are
# generated, not written.
# Of 9 quantities, 1 sit inside a published range, 1 outside one, and 7 have no published range at all.

[[boundary_row]]
quantity = "cohesion, lunar in situ"
published_range = "0.44 to 0.62 kPa"
used = "0.52 kPa, swept over four decades"
status = "inside_published_range"
basis = "Heiken et al. (1991) Table 9.12, 327 in-situ tests; it is the entire traction margin on a repose slope but slip depends on it only logarithmically, so the published range moves slip 6%"

[[boundary_row]]
quantity = "friction angle on a repose slope"
published_range = "none at the surface; 42 degrees over 0-15 cm"
used = "32.0 degrees, the slope angle itself"
status = "no_published_range"
basis = "a slope standing at theta has mobilized theta whatever its density; the surface density gap is the soil file's surface_density_unresolved anomaly"

[[boundary_row]]
quantity = "angle of repose"
published_range = "none transcribed in this repository"
used = "30 to 35 degrees, carried as a band"
status = "no_published_range"
basis = "stated range, not a transcribed parameter; annotation only"

[[boundary_row]]
quantity = "leg inertia"
published_range = "none"
used = "uniform rod, 1.5 kg over 0.3 m"
status = "no_published_range"
basis = "assumed; a real leg puts more mass proximally, so this overestimates the inertial term"

[[boundary_row]]
quantity = "walking speed"
published_range = "none"
used = "0.5 m/s"
status = "no_published_range"
basis = "an operating condition, not a platform property; swing cost per meter goes as its square while the soil terms do not depend on it, so this model always prefers walking slower and a real one does not"

[[boundary_row]]
quantity = "stance regime"
published_range = "none"
used = "quasi-static, feet planted"
status = "no_published_range"
basis = "gaits with a flight phase violate it and the traction balance does not apply to them; not detected, so do not apply this to a bounding or galloping gait"

[[boundary_row]]
quantity = "slip on level ground"
published_range = "none"
used = "zero, as the balance gives it"
status = "no_published_range"
basis = "level ground demands no tangential force; real slip there comes from within-stride acceleration, control error and foot placement, none modelled, so this is a lower bound"

[[boundary_row]]
quantity = "shear mobilization under gait"
published_range = "none"
used = "K = 18.0 mm per footfall"
status = "no_published_range"
basis = "K now propagates into slip and from there into every term; its sensitivity is swept in the report rather than stated"

[[boundary_row]]
quantity = "compaction as tangential resistance"
published_range = "not applicable"
used = "excluded from the traction balance"
status = "outside_published_range"
basis = "a wheel makes new rut and pays in forward motion; a placed foot pays that work downward, so a vehicle-derived resistance term would inflate demand and understate every slope"

[traction_limit_summary]
lunar_degrees = 43.545928803868314
