# Which of the three binds, now that three compete.
[binding]
statement = """
Charge does not bind. A modest array at the crest recharges a sortie's
battery in hours against a sortie that takes days, so throughput is set
by how long the walk takes rather than how long the waiting takes.

What binds is duration, and duration is a choice. Sortie energy is least
at about a third of a metre per second, where rising swing work meets
falling survival energy. Throughput is greatest at roughly twice that,
because a shorter sortie repeats sooner even when it costs more -- until
slip runs away near the gait limit from rung three and throughput falls
again.

So there is no single best speed, and which one to walk is a mission
decision between energy and throughput rather than a physical limit.
"""

# Of 9 quantities, 3 sit inside a published range, 1 outside one, and 5 have no published range at all.

[[boundary_row]]
quantity = "horizon search range"
published_range = "not applicable"
used = "within the 20 km window only"
status = "outside_published_range"
basis = "19% of ray samples leave the grid and count as clear sky. Distant massifs shadow polar sites from tens of kilometres, so every lit fraction is an upper bound -- one-sided, since extra terrain can only raise a horizon"

[[boundary_row]]
quantity = "solar disc"
published_range = "0.53 degrees, standard"
used = "disc of angular radius 0.265 degrees"
status = "inside_published_range"
basis = "a point Sun would report a hard shadow edge that does not exist; at polar elevations the penumbra covers real ground"

[[boundary_row]]
quantity = "lunar curvature"
published_range = "not applicable"
used = "d^2/2R drop applied along every ray"
status = "inside_published_range"
basis = "29 m at 10 km, comparable to the relief that decides a horizon at grazing incidence; omitting it would overstate shadowing"

[[boundary_row]]
quantity = "solar ephemeris"
published_range = "not applicable"
used = "analytic, swept over hour angle and obliquity"
status = "no_published_range"
basis = "SPICE would give event times; this gives a fraction, and the fraction is limited by the horizon rather than by the ephemeris"

[[boundary_row]]
quantity = "array area and efficiency"
published_range = "none"
used = "0.5 m2 at 30%"
status = "no_published_range"
basis = "assumed, and it does not bind: recharge takes hours against a sortie of days, so throughput is limited by walking rather than by waiting"

[[boundary_row]]
quantity = "array pointing"
published_range = "none"
used = "assumed able to face the Sun"
status = "no_published_range"
basis = "at a pole the Sun is within a couple of degrees of the horizon, so a horizontal panel would collect almost nothing and this assumption is doing real work"

[[boundary_row]]
quantity = "sunlight on the platform"
published_range = "none"
used = "absent"
status = "no_published_range"
basis = "solar input at the rim would change Day 8's thermal balance entirely, in the favourable direction; deliberately out of scope"

[[boundary_row]]
quantity = "secondary illumination"
published_range = "none"
used = "absent"
status = "no_published_range"
basis = "light scattered from sunlit walls reaches shadowed floors, which ShadowCam measures and this does not; it affects vision rather than the energy budget"

[[boundary_row]]
quantity = "destination shadowing"
published_range = "none"
used = "87.7% lit at the crest, 0% at the destination"
status = "inside_published_range"
basis = "closes the boundary row open since Day 7: the route ends in permanent shadow, and that conclusion survives a wider horizon"
