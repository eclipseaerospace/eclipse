# The answer the week has been converging on.
[verdict]
locomotion_power_W = 19.2
bare_survival_power_W = 198.0989255652967
emissivity_for_parity = 0.08244755361003242
statement = """
The sortie is thermally bounded unless the platform is insulated, and
insulation is a design choice rather than a physical limit. Bare, holding a lithium cell above its lower limit costs about ten times what
walking costs, and reachable depth collapses. Below an effective
emissivity of about eight percent it costs less than walking, and
multi-layer insulation reaches that routinely.

So the physics does not deliver a verdict; it delivers a requirement,
and the requirement is on the radiating surface. Nothing about the feet
enters: conduction into regolith is three orders of magnitude smaller
than radiation to the sky, because the ground is a better insulator
than anything the platform could be wrapped in.
"""

# Of 10 quantities, 3 sit inside a published range, 0 outside one, and 7 have no published range at all.

[[boundary_row]]
quantity = "regolith thermal conductivity"
published_range = "1.5e-5 W/(cm K) in the upper 1-2 cm"
used = "0.0015 W/(m K)"
status = "inside_published_range"
basis = "Vaniman et al. (1991) ch. 3, Apollo heat-flow probes; the printed unit is wrong and is recorded as an anomaly in the soil file rather than silently repaired"

[[boundary_row]]
quantity = "cold trap temperature"
published_range = "25 K measured minimum, 38 K at the LCROSS site"
used = "38 K"
status = "inside_published_range"
basis = "Paige et al. (2010), Diviner; the Sourcebook predates it"

[[boundary_row]]
quantity = "thermal model"
published_range = "not applicable"
used = "one node, lumped capacitance, quasi-steady"
status = "no_published_range"
basis = "a real platform has a gradient between its battery and its feet and the engineering lives there; one node answers whether the mission shape exists and hides nothing about which term dominates"

[[boundary_row]]
quantity = "conduction geometry"
published_range = "not applicable"
used = "spreading resistance of a disc on a half-space"
status = "inside_published_range"
basis = "exact for the geometry, and it needs no path length -- a quantity nobody could have supplied honestly for semi-infinite ground"

[[boundary_row]]
quantity = "radiating area"
published_range = "none"
used = "1.0 m2"
status = "no_published_range"
basis = "assumed; the survival power scales with it directly"

[[boundary_row]]
quantity = "effective emissivity"
published_range = "none"
used = "swept 0.01 to 1.0, nominal 0.85"
status = "no_published_range"
basis = "the single most consequential platform property here, and a design choice: below 0.082 thermal costs less than walking and above it walking is a rounding error"

[[boundary_row]]
quantity = "thermal mass"
published_range = "none"
used = "45 kJ/K"
status = "no_published_range"
basis = "assumed; it sets how long cooling takes and not what holding temperature costs, so it moves one figure and not the other"

[[boundary_row]]
quantity = "battery lower limit"
published_range = "none transcribed here"
used = "-20 °C"
status = "no_published_range"
basis = "conventional for lithium cells; the first thing to stop working, and the limit the cooling curve is measured against"

[[boundary_row]]
quantity = "internal dissipation"
published_range = "none"
used = "swept 0 to 50 W"
status = "no_published_range"
basis = "avionics waste heat is free warmth; a platform that computes harder stays warmer, which is a real design coupling this study does not resolve"

[[boundary_row]]
quantity = "illumination and charge duty cycle"
published_range = "none"
used = "absent"
status = "no_published_range"
basis = "still empty after two axes; they bound sorties per week rather than depth per sortie"
