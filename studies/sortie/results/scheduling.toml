published_range = "not applicable"
used = "analytic; hour angle per lunation, declination per year"
status = "no_published_range"
basis = "no SPICE kernel. The 18.6-year nodal precession is absent, which moves the obliquity amplitude rather than the period, and the amplitude is already the least certain input here"

[[boundary_row]]
