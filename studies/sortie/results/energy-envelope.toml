# Whether locomotion binds. A route is a distance and a duration, so
# energy over duration is a power, and that power is the bar another
# subsystem has to clear to matter as much as walking.
#
# No survival-heating figure is quoted because none is transcribed in
# this repository. The crossover is a property of this route and this
# platform and needs no source.
[binding]

[[binding.at_speed]]
speed_m_per_s = 0.15
sortie_hours = 93.46635608454822
average_locomotion_power_W = 11.508532932693427

[[binding.at_speed]]
speed_m_per_s = 0.25
sortie_hours = 56.07981365072892
average_locomotion_power_W = 19.180888221155715

[[binding.at_speed]]
speed_m_per_s = 0.5
sortie_hours = 28.03990682536446
average_locomotion_power_W = 38.36177644231143

[binding.conclusion]
average_locomotion_power_W = 19.180888221155715
at_speed_m_per_s = 0.25
statement = """
Locomotion is not the binding term. Spread over the time this route
takes, it averages tens of watts, which is comparable to the
housekeeping of a small robot and small against what a forty-kelvin
environment plausibly demands. A continuous load equal to that average
halves locomotion's share of the sortie.

Seven days have gone into the term that does not bind. That was worth
doing, because it is the term that had to be shown adequate before any
of the others could be trusted -- but rung five is thermal, and this is
the measurement that says so.
"""

# Of 10 quantities, 2 sit inside a published range, 0 outside one, and 8 have no published range at all.

[[boundary_row]]
quantity = "route"
published_range = "not applicable"
used = "straight transect, 24.9 km"
status = "no_published_range"
basis = "a transect rather than a plan; a planner would optimise against the cost model being measured, and could only reduce the energy"

[[boundary_row]]
quantity = "terrain"
published_range = "5 m LOLA grid, 20 km window"
used = "sampled by nearest cell along the line"
status = "inside_published_range"
basis = "no second interpolation: the grid is already about nine tenths interpolated by its producers"

[[boundary_row]]
quantity = "actuator and avionics derating"
published_range = "none"
used = "3× to 5×, nominal 4×"
status = "no_published_range"
basis = "mechanical work is not battery draw; a named parameter and swept, because no design has fixed it"

[[boundary_row]]
quantity = "battery capacity"
published_range = "none"
used = "swept; depth reported per watt-hour"
status = "no_published_range"
basis = "assumed like leg inertia was, so the rate is reported rather than a single depth"

[[boundary_row]]
quantity = "survival heating"
published_range = "none transcribed here"
used = "absent"
status = "no_published_range"
basis = "would reduce reachable depth. The bar it must clear to matter more than walking is 19 W continuous, and a forty-kelvin environment plausibly exceeds it"

[[boundary_row]]
quantity = "active illumination"
published_range = "none"
used = "absent"
status = "no_published_range"
basis = "would reduce reachable depth; a shadowed route carries its light"

[[boundary_row]]
quantity = "charge duty cycle"
published_range = "none"
used = "absent"
status = "no_published_range"
basis = "sets sorties per week rather than depth per sortie, so it bounds the schedule rather than this curve"

[[boundary_row]]
quantity = "comms below the rim"
published_range = "none"
used = "absent"
status = "no_published_range"
basis = "an autonomy requirement rather than an energy one, and the reason the perception and estimation seam is kept modular"

[[boundary_row]]
quantity = "destination shadowing"
published_range = "none"
used = "not established"
status = "no_published_range"
basis = "the route ends at the deepest ground the product covers; whether that is a cold trap is the illumination axis, and de Gerlache's own interior lies outside this window"

[[boundary_row]]
quantity = "regeneration"
published_range = "not applicable"
used = "none; descent clamped at zero cost"
status = "inside_published_range"
basis = "a leg without regeneration dissipates surplus gravitational work rather than banking it, which is the conservative reading"
