#
# Locomotion energy along a route over measured ground, out and back.
#
# Generated by studies/sortie/energy_envelope.py. Do not edit.
#
# THIS IS NOT A SORTIE ENVELOPE. A sortie needs six axes and one is
# populated. Illumination, thermal, power, comms and cold-trap range are
# declared and empty; every one of them reduces reachable depth or
# bounds the schedule, so every number here is an upper bound.

schema_version = 1

[environment]
python = "3.12.13"
numpy = "2.5.1"

[inputs]
site = "de-gerlache-rim-2"
terrain = "SL2_final_adj_5mpp_surf"
platform = "nominal-quadruped"
soil = "lunar-intercrater"
gravity_m_per_s2 = 1.62
feet_in_stance = 3
crawl_duty_factor = 0.75

[route]
construction = "straight transect, rim crest to the deepest cell"
samples = 1200
horizontal_km = 24.851508002533766
descent_m = 3625.435546875
walked_km_one_way = 25.235916142828017
mean_absolute_slope_deg = 8.530679168641536
max_absolute_slope_deg = 22.677434775125004

# The asymmetry. Gravity is signed and the dissipative terms are not, so
# a return leg is not an outbound leg reversed.
[round_trip]
outbound_Wh = 55.22676118959669
return_Wh = 213.68839808487178
total_Wh = 268.91515927446846
return_over_outbound = 3.8692907837065995
total_over_twice_outbound = 2.4346453918532998
outbound_free_segment_fraction = 0.19099249374478733
return_free_segment_fraction = 0.0
free_meaning = "gravity more than pays for the ground; clamped at zero because a leg without regeneration cannot bank the surplus"

# Reachable depth per watt-hour, which is the platform-agnostic form.
