# The specification this study produces, and the thing it is for.
[specification]
statement = """
Slope is resolved adequately for the legged limits and unresolvable
below the DEM's effective baseline. No orbital dataset reaches stride
scale: the best stereo imagery posts an order of magnitude above a
300 mm step, and this grid carries no scale trend to extrapolate along.

It does not need to. At 99.99 percent traversable against the legged
limits, gradient is not what stops a foot at that scale. Whether a block
exceeds foot clearance is, and that is a size-frequency distribution
from imagery rather than a slope distribution from altimetry.

A landing-site assessment that needs stride-scale traversability should
therefore commission boulder statistics, not a finer DEM.
"""

# The measured-versus-extrapolated boundary for this study.
# Of 9 quantities, 4 sit inside a published range, 1 outside one, and 4 have no published range at all.

[[boundary_row]]
quantity = "slope at DEM baseline"
published_range = "5 m grid, 20 km window"
used = "5 m to 320 m by aggregation"
status = "inside_published_range"
basis = "NASA GSFC PGDA, LOLA track-adjusted; the finest product published for this latitude"

[[boundary_row]]
quantity = "slope algorithm"
published_range = "not stated by the producers"
used = "central difference"
status = "inside_published_range"
basis = "identified rather than assumed, by reproducing the producers' own slope raster to under a thousandth of a degree; Horn differs by three orders of magnitude more"

[[boundary_row]]
quantity = "effective resolution"
published_range = "none stated"
used = "the 5 m grid as posted"
status = "no_published_range"
basis = "the producers state 90% of pixels are interpolated, so the grid spacing is not the measurement spacing and no effective baseline is published"

[[boundary_row]]
quantity = "slope at stride scale"
published_range = "none, from any orbital dataset"
used = "not estimated"
status = "no_published_range"
basis = "a 300 mm stride is an order of magnitude below the ~2 m posting of the best stereo imagery, and this grid carries no scale trend to extrapolate along. It also does not bind: at 99.99% traversable the constraint at that scale is obstacle size-frequency, not gradient"

[[boundary_row]]
quantity = "obstacle size-frequency"
published_range = "none in this repository"
used = "not modelled"
status = "no_published_range"
basis = "the binding stride-scale constraint, and a different measurement: whether a block exceeds foot clearance. Boazman's NAC boulder survey is the dataset that would answer it"

[[boundary_row]]
quantity = "DEM slope error"
published_range = "1.5 to 2.5 deg median RMS"
used = "propagated through the traversable fraction"
status = "inside_published_range"
basis = "producers' stated value; it moves the crew limit by over a percentage point and the legged limits by under a thousandth"

[[boundary_row]]
quantity = "projection scale distortion"
published_range = "not applicable"
used = "a constant 5 m cell"
status = "outside_published_range"
basis = "polar stereographic is conformal, not equidistant: the point scale factor is 1.0000 at the pole and about 1.000239 here, so slope on the nominal cell is low by that fraction. Under a twentieth of a percent, and uncorrected"

[[boundary_row]]
quantity = "region centre"
published_range = "none citable"
used = "the product's own extent"
status = "no_published_range"
basis = "no public source gives coordinates for the Artemis III region; the product centre is 88.23S, 53.7 km from the pole against NASA's stated 50 km"

[[boundary_row]]
quantity = "crew slope limit"
published_range = "20 deg"
used = "20 deg"
status = "inside_published_range"
basis = "Rice et al. (2023), citing the Artemis III Science Definition Team"
