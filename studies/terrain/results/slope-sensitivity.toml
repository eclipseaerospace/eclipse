# The scale result. For a self-affine surface mean slope goes as the
# baseline to the power of the Hurst exponent minus one; natural terrain
# gives roughly -0.30 to -0.10. This grid gives near zero, so there is no
# trend in it to carry toward a footstep.
[scale_trend]
method = "central_difference, block-mean aggregation"
baseline_m = [5.0, 10.0, 20.0, 40.0, 80.0, 160.0, 320.0]
mean_slope_deg = [12.721258517910982, 12.642530167542642, 12.575892517331809, 12.506336105848218, 12.418266896956306, 12.300223428802322, 12.073555417492761]
