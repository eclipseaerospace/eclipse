[summary]
text = """
Does the legged case close on the terrain that has been mapped. No.

Across ten sites from the same charge point at 400 Wh, the rover reaches
17.04 km² of permanently shadowed ground against the quadruped's 14.26 and
a suited crew's 0.65. It reaches more cold trap at 7 of the ten. On total
ground the margin is wider still: 864 km² against 689.

The mechanism is a crossover at eight degrees and the fact that polar
terrain is mostly below it. A wheel pays no swing work, which is the
largest term in the legged budget at lunar gravity, and it pays compaction
as a rolling resistance instead. On gentle ground the trade is strongly in
its favour. Above the crossover it reverses hard, and past 26.6 degrees
the rover cannot hold the slope at all while the quadruped continues to
39.8 — but Day 13 already established that no route to a cold trap in
these windows needs more than 15 degrees. The legged advantage is real and
it is on ground these errands do not cross.

The irony is worth recording. Bekker built this model for vehicle
mobility, and every plate-sinkage campaign this repository has transcribed
— KLS-1, GRC-1 — was run to characterise wheels. Fifteen days of
terramechanics calibrated from wheel literature and applied to feet, and
the wheel is what the same data supports.

What the result is not: an answer about legged robotics, or about any
terrain that has not been mapped at 5 m. Every clause in the claim is
doing work. There are no obstacles in this comparison, and a boulder above
wheel diameter stops a rover where a legged platform steps over it — that
is the mechanism by which legs win and there is no dataset at the scale
that would show it. There is no pit, because no archive holds a polar one.
There is no slope past the angle of repose, because these routes do not
meet it.

And the strongest argument on the table runs the same way as the result
rather than against it. Twelve or more actuators in abrasive cryogenic
dust against four to six is why every funded programme is wheeled, and
nothing here models it. A comparison that omits reliability and still
finds for the wheel is not one that reliability would rescue.
"""

