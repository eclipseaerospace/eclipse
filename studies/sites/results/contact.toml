# Written once, properly, rather than scattered across fifteen tables.
[absences]
obstacles = "no boulder or rock-abundance statistics anywhere. Every square kilometre is counted as though a foot could be placed anywhere in it"
operational_margin = "no reserve, no contingency, no failure modes, no degradation. The battery is spent to the last watt-hour and the machine never breaks"
soil = "one soil at every cell of every site. A crater floor is not the same regolith as a rim and nothing here can tell them apart"
analysis_window = "every reachable set is clipped by a 16 km window rather than by the platform, so areas at large batteries are lower bounds"
region_coverage = "three of the nine candidate regions have no 5 m product in this archive, so every count over the nine is a lower bound"
slope_decidability = "the products state 1.5 to 2.5 degrees of RMS slope error, which makes Haworth's Day 11 refusal and Shackleton's Day 13 crossing undecidable"
surface_line_of_sight = "the aggregate area a relay sees is stable across resolution, but whether a single link closes turns on roughness below the grid"
link_budget = "visibility is geometry. Antenna gain, power and data rate are a different study and none of it is here"
hardware = "no platform has been built, no soil has been touched, and no result in this repository has been compared against a physical measurement"

[answer]
statement = """
An autonomy requirement, and the duration is a dwell rather than a walk.

The structure is the one polar geometry forces. A lit crest sees Earth
for the same reason it sees the Sun -- high ground, low skyline. A cold
trap is hidden from Earth by the same rim that hides it from the Sun. So
the places worth going are close to exactly the places you cannot talk
from, and that is not a property of any site in this set.

But the mission is not blind, because contact does not have to be
continuous. Libration swings Earth seven degrees either way against mean
elevations of half a degree to four, so most of this ground is in touch
for part of a month rather than none of it. The walk out barely loses the
link at all -- minutes on the worst route here, nothing on several -- and
the blackout is at the destination, which is where the platform stops and
works.

So the requirement is: operate unattended for a dwell, in a hole, with a
link that returns when the platform climbs out. That is a far weaker
autonomy requirement than continuous unsupervised traverse, and it is the
first time this project has stated one in a form a design could be built
against.

A relay on the rim does not close the gap, and that is now measured
rather than asserted. A mast at the charge point recovers 1.3% of the blind
ground across these ten sites and 0.7% of the blind cold trap; at 3 of
the ten it recovers nothing at all. The reason is structural and not a
matter of siting: the charge point is chosen for sunlight, sunlight means
high and open ground, and high open ground is already in touch with
Earth. A relay there covers the ground that least needs covering, and it
cannot see into a hole any more than Earth can.

That conclusion was nearly the opposite one. Charging each cell's
occlusion to the single azimuth bin its centre falls in leaves gaps
between the cells of a ridge, so a ridge near the mast stopped blocking
and the leak grew with resolution. The relay area then moved sixfold
across a coarsening and looked like a quantity the products could not
decide — a defect in how it was computed, wearing the costume of a
result about terrain. Once each cell occludes the sector it actually
subtends, the area moves 1.07× across the same coarsening against Earth's
1.08×, and both are reportable. The failure is worth recording because
it was invisible from the output: an under-resolved viewshed returns a
plausible number, and the shortfall reads as terrain.

What the grid still cannot settle is any single link. The aggregate area
is stable, but a boulder or a metre-scale rise below the posting blocks
a sightline without moving the total, so the metre-scale stereo already
specified for boulders and for pits is wanted here too — for whether a
given link closes, not for how much ground a relay covers.

Six axes populated is not six axes validated. The absence list above is
the distance between those two things, and it is the most useful thing in
this report: no obstacles, no margin, no failure modes, one soil, three
regions with no data, two sharp results the map cannot decide, and no
hardware anywhere. Every number in fifteen days is a ceiling, and that
list is the specification of what would turn them into floors.
"""

# Of 9 quantities, 3 sit inside a published range, 3 outside one, and 3 have no published range at all.

[[boundary_row]]
quantity = "Earth visibility"
published_range = "not applicable"
used = "disc clearing the local skyline over a libration cycle"
status = "inside_published_range"
basis = "moves by 1.08 times across an eightfold coarsening of the grid, the same stability the sunlit fraction has and for the same reason: a horizon is set by distant large terrain rather than by near-field roughness"

[[boundary_row]]
quantity = "surface line of sight"
published_range = "not applicable"
used = "a viewshed from the charge point, aggregate area only"
status = "outside_published_range"
basis = "the area moves 1.07 times across an eightfold coarsening and 1.08 times when the viewshed's own binning is refined, so the aggregate is stable enough to report. Whether any particular link closes is not: a boulder or a metre-scale rise below the grid blocks a sightline without moving the total, on a product the producers state is about nine tenths interpolated at 5 m"

[[boundary_row]]
quantity = "libration model"
published_range = "optical libration, 7.9 and 6.7 degrees"
used = "two sinusoids on the anomalistic and draconic months"
status = "inside_published_range"
basis = "no SPICE kernel and no physical libration. The two periods do not close together, so a fraction over one month is not quite a fraction over a year, and the answer is dominated by terrain rather than by ephemeris"

[[boundary_row]]
quantity = "Earth as a disc"
published_range = "0.95 degrees angular radius"
used = "partial visibility counted as contact"
status = "inside_published_range"
basis = "Earth subtends four times the Sun's disc, so at grazing elevations the band of partly-visible ground is wide. Counting partial as contact is the generous direction and is stated as such"

[[boundary_row]]
quantity = "link budget"
published_range = "none"
used = "absent; this is geometry only"
status = "no_published_range"
basis = "whether a platform in sight of Earth can close a link at a useful rate depends on antenna gain, transmit power and data rate, none of which is modelled. Visibility is necessary and not sufficient"

[[boundary_row]]
quantity = "horizon search range"
published_range = "not applicable"
used = "within each product only"
status = "outside_published_range"
basis = "rays leaving the window count as clear sky, so Earth visibility is an upper bound in exactly the way sunlight is: distant terrain can only occlude further"

[[boundary_row]]
quantity = "contact mask resolution"
published_range = "not applicable"
used = "100 m on a 5 m reachable set"
status = "outside_published_range"
basis = "visibility is sampled coarser than the set it is intersected with, so every blind area carries the coarser resolution"

[[boundary_row]]
quantity = "autonomy requirement"
published_range = "none"
used = "a blind fraction and a blind duration, not a design"
status = "no_published_range"
basis = "the output is how much blind operation over what duration. What it takes to build a machine that can do it is a different problem and this study does not touch it"

[[boundary_row]]
quantity = "hardware"
published_range = "none"
used = "none; nothing here has been measured against a machine"
status = "no_published_range"
basis = "fifteen days of simulation against published data. The honest ceiling remains physics-consistent rather than validated"
