# The canonical legged case, and why it is absent rather than negative.
[pits]
present_in_this_archive = false
present_in_the_published_catalogue_at_these_latitudes = false
median_catalogued_diameter_m = 16.0
cells_across_at_5_m_posting = 3.2
basis = "Wagner and Robinson (2014): pits occur in mare and impact-melt deposits at low and middle latitudes; the highest published candidates are near 72 north. Even a polar pit would need metre-scale stereo to resolve, so this is a specification for the next measurement rather than a gap to approximate"

[answer]
statement = """
Not slope-limited inside the candidate regions. Slope-limited at the one
site the crew programme excludes.

The deepest cold trap in each candidate region sits six to nineteen
kilometres out and seven hundred to two thousand nine hundred metres
down, and the hardest of those journeys -- Haworth -- needs 15.0 degrees
of slope capability against a crew limit of twenty. So the harder errand
does not rescue the gradient argument, and Day 12's result survives being
pushed.

Shackleton Rim is where a row crosses. Its floor is 4,577 m below the
charge point and reaching it needs 22.1 degrees, and Shackleton is not a
candidate region precisely because it is not safe to land in. The one
journey here that a crew could not make is at the site the crew
programme already excluded, which is the thesis being enforced by the
data rather than asserted.

Two things keep that from being a rescue. The crossing is 2.1 degrees
past the limit against a map whose stated slope error is 1.5 to 2.5, so
it is not decidable on this data -- the same problem Haworth had on Day
11 and it is reported the same way. And comparing on slope alone flatters
the crew, who are also held to a two kilometre traverse range that every
one of these deep errands breaks.

So the honest form is narrower than either. Reaching lunar polar shadow
is not a gradient problem. What excludes a crew from these journeys is
range and duration, and what would exclude them on gradient is terrain
nobody has selected and this archive barely samples. The legged case
rests on obstacles, pits and lava tubes rather than on slope, and none of
those can be measured with a 5 m polar DEM. That is a specification, in
the same shape as the four this project has already produced.
"""

# Of 9 quantities, 2 sit inside a published range, 3 outside one, and 4 have no published range at all.

[[boundary_row]]
quantity = "target selection"
published_range = "none"
used = "nearest edge, floor of that shadow, deepest cold trap"
status = "no_published_range"
basis = "three errands chosen to span what a mission might be for, not measured against any published mission profile. The first was the only one earlier days ran, and it is the gentlest of the three at every site"

[[boundary_row]]
quantity = "target sampling"
published_range = "not applicable"
used = "250 m, checked at 100 m"
status = "outside_published_range"
basis = "the illumination grid that targets are chosen from is coarser than the grid routes are planned on. At 250 m the floor of the nearest shadow is the nearest shadow at eight of ten sites; at 100 m they separate by tens of metres of drop. Both numbers are reported and the coarse one is what the headline uses, so the comparison with Day 12 holds"

[[boundary_row]]
quantity = "crew comparison"
published_range = "Rice et al. (2023): 20 degrees, 2 km"
used = "20 degrees as a slope limit only"
status = "inside_published_range"
basis = "a suited crew is limited by far more than gradient -- consumables, walkback, dust, thermal load, and a two kilometre traverse range this study does not apply here. Comparing on slope alone flatters the crew and is the conservative direction for a legged argument"

[[boundary_row]]
quantity = "mission concept at the excluded site"
published_range = "not applicable"
used = "a sortie designed around the robot"
status = "outside_published_range"
basis = "Shackleton Rim is not an Artemis III candidate region and is run here as though a mission were built around a legged platform rather than around a crew landing. That is a different concept and every number from it inherits the difference"

[[boundary_row]]
quantity = "pits and skylights"
published_range = "Wagner and Robinson (2014): 200+ pits, 5 to 900 m"
used = "absent; none exists at these latitudes"
status = "outside_published_range"
basis = "the canonical legged case and it cannot be tested here. Pits sit in mare and impact-melt deposits at low and middle latitudes, the highest published candidates near 72 north, and none in this polar archive. The median catalogued pit is about 16 m across, three cells on a 5 m grid, so even a polar one would need metre-scale stereo rather than these products"

[[boundary_row]]
quantity = "boulders"
published_range = "none"
used = "absent"
status = "no_published_range"
basis = "the specification Day 6 produced, still unfilled. If reaching shadow is not slope-limited then what limits it is obstacles, and obstacle statistics need imagery this project does not carry"

[[boundary_row]]
quantity = "descent as a depth"
published_range = "not applicable"
used = "round-trip energy as a field over every cell"
status = "inside_published_range"
basis = "a descent is not a yes or a no. The field answers how deep a battery reaches including the climb back, for ground the planned route never visits, and at Shackleton Rim the floor costs 1216 Wh"

[[boundary_row]]
quantity = "slope decidability"
published_range = "producers: 1.5 to 2.5 degrees RMS slope error"
used = "capabilities reported to 0.05 degrees"
status = "no_published_range"
basis = "the bisection resolves far finer than the map does. A capability within the stated slope error of the crew limit would not be decidable; the one that crosses does so by 2.1 degrees, which is inside that error and is stated as undecidable rather than as a crossing"

[[boundary_row]]
quantity = "soil"
published_range = "Carrier et al. (1991) lunar intercrater"
used = "the same soil at every cell of every site"
status = "no_published_range"
basis = "carried forward. A crater floor is not the same regolith as a rim and this study cannot tell the difference"
