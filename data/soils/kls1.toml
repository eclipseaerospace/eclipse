# --- Lim et al. (2021)
#
# Transcribed, not implemented. The published plate scaling
# plate_scaling_slope * b + plate_scaling_intercept is negative across the
# whole tested range of half-widths, crossing zero at b = 0.0754 m, so these
# parameters do not reproduce sensible pressures under the stated equations.
#
# The length-convention explanation was tested and does not hold. That crossing
# sits within 0.05 percent of the largest plate diameter, but reading b as the
# diameter leaves the scaling negative on every plate anyway, at -35.7, -12.5
# and -0.9. The irreproducibility is in the equation form, not in whether b is
# a radius or a diameter. Do not guess at a fix.

[[dataset.model]]
id         = "dimensional_analysis_lim2021"
status     = "not_reproducible"
fit_method = "unweighted_least_squares"

[dataset.model.parameters]
sinkage_exponent         = { value =    0.79268,  units = "1",   sigma = nan }
plate_scaling_slope      = { value = 2320.5507,   units = "1/m", sigma = nan }
plate_scaling_intercept  = { value = -174.9706,   units = "1",   sigma = nan }

[dataset.model.quality]
metric = "goodness_of_fit_wong2001"
units  = "percent"
by_plate = [
  { contact_half_width_m = 0.0300, value = 93.23 },
  { contact_half_width_m = 0.0350, value = 88.37 },
  { contact_half_width_m = 0.0375, value = 90.80 },
]

[dataset.model.validity]
contact_half_width = { min = 0.0300, max = 0.0375, units = "m" }
sinkage            = { min = 0.0,    max = 0.095,  units = "m" }
bed_density        = { min = 1602,   max = 1602,   units = "kg/m^3" }
gravity            = { min = 9.81,   max = 9.81,   units = "m/s^2" }
