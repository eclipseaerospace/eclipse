# SPDX-License-Identifier: Apache-2.0
#
# KLS-1 pressure-sinkage, digitized from the published figures.
#
# Points are estimates read off a figure, not measurements. Individual
# replicate curves cross repeatedly and could not be separated, so each figure
# is recorded as one band and test_id names the figure rather than a test.
# Curve identity is not needed for a fit: it pools points per plate size.

schema_version = 1
id = "lim2021-pressure-sinkage"
kind = "pressure_sinkage"

[source]
doi = "10.5140/JASS.2021.38.4.237"
figure = "Figures 12, 13, 14"
license = "CC-BY-NC-3.0"

[digitization]
tool = "WebPlotDigitizer (automeris.io)"
method = "manual, sampled by column; replicates not separable"
operator = "b1aha"
performed_on = 2026-08-04
sinkage_uncertainty_m = 0.0005
pressure_uncertainty_kPa = 0.6

[digitization.axis_calibration]
x = { minimum = 0.0, maximum = 0.1, units = "m", scale = "linear" }
y = { minimum = 0.0, maximum = 160.0, units = "kPa", scale = "linear" }

[series]
path = "lim2021-pressure-sinkage.csv"
sha256 = "79d790764c85e9389e655e2e5c95944d4e254285cc82dd9da7bed1e60edb37a3"
columns = ["contact_half_width_m", "test_id", "sinkage_m", "pressure_kPa"]
